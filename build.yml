name: Build APK from ZIP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './node_modules/*' | head -n1)
          if [ -z "$ZIP" ]; then echo "ZIP-файл не найден в репозитории"; exit 1; fi
          echo "Берём: $ZIP"
          mkdir -p unz app/www
          unzip -o "$ZIP" -d unz
          IDX=$(find unz -name index.html -not -path '*__MACOSX*' | head -n1)
          if [ -z "$IDX" ]; then echo "В ZIP нет index.html"; exit 1; fi
          cp -r "$(dirname "$IDX")"/. app/www/
          ls app/www
      - name: Build APK
        run: |
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Arena Duel" com.arena.duel --web-dir www
          npx cap add android
          npx cap sync android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arena-duel-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
